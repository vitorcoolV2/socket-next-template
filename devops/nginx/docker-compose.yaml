services:

  web-server:
    image: nginx:latest
    container_name: web-server
    #user: "1000:1000"
    user: root
    #network_mode: "host"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro      
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
      

networks:
  app-network:
    external: true
