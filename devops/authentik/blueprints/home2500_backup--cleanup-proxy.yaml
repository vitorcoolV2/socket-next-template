version: 1
## tpl: authentik/app/blueprints/CLIENT_APP_NAME--cleanup-proxy.yaml
## yaml: authentik/blueprints/home2500_backup--cleanup-proxy.yaml
metadata:
  name: "Home2500 backup cleanup proxy"
  slug: blueprint-home2500-backup-cleanup-proxy
entries:
  # 1. Remover Bindings PRIMEIRO (eles dependem da App existir para serem encontrados via !Find)
  - model: authentik_policies.policybinding
    identifiers: 
      target: !Find [authentik_core.application, [slug, "backup"]]
    state: absent
    # Permitimos que este passo falhe silenciosamente caso a App já não exista
    conditions:
      - !Find [authentik_core.application, [slug, "backup"]]

  # 2. Remover Application
  - model: authentik_core.application
    identifiers:
      slug: "backup"
    attrs:
      name: "BackRest"
    state: absent

  # 3. Remover o Provider
  - model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: "backup-provider"
    state: absent
