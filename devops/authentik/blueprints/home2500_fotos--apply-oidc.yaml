version: 1
## tpl: authentik/app/blueprints/CLIENT_APP_NAME--apply-oidc.yaml
## yaml: authentik/blueprints/home2500_fotos--apply-oidc.yaml
metadata:
  name: Home2500 fotos apply oidc
  slug: blueprint-home2500-fotos-apply-oidc
  labels:
    Domain: "fotos.home2500.local"
    
entries:  
  - model: authentik_providers_oauth2.oauth2provider
    id: prov-fotos-oidc
    identifiers:
      name: "fotos-provider"
    attrs:
      client_type: "confidential"
      client_id: "immich-fdgds53c"
      client_secret: "Y2yme4oPNzWbNE7RxJmKbwStNdYFuv4DyfyvdtLT5cemeffss"
      
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]

      redirect_uris: 
        - { "url": "https://fotos.home2500.local/auth/login", "matching_mode": "strict" }
        - { "url": "https://fotos.home2500.local/user-settings", "matching_mode": "strict" }
        - { "url": "https://fotos.home2500.local/", "matching_mode": "strict" }
      
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      
      property_mappings: !FindMany [authentik_core.propertymapping, [name, [
        "authentik default OAuth Mapping: OpenID 'email'",
        "authentik default OAuth Mapping: OpenID 'openid'",
        "authentik default OAuth Mapping: OpenID 'profile'"
      ]]]
  
  - model: authentik_core.application
    id: app-fotos
    identifiers:
      slug: "fotos"
    attrs:
      name: "Immich fotos"
      provider: !KeyOf prov-fotos-oidc
      group: "Ferramentas"
      meta_description: "Gestão de fotografias e vídeos (Self-hosted Google Photos alternative)"
      meta_launch_url: "https://fotos.home2500.local/"      
      meta_icon: "https://auth.home2500.local/static/dist/assets/icons/home2500-icon.svg"

  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf app-fotos, group: !Find [authentik_core.group, [name, "Home-Admins"]] }
    attrs: { order: 0 }          
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf app-fotos, group: !Find [authentik_core.group, [name, "Home-Developers"]] }
    attrs: { order: 1 }      
