services:
  socket-io-db:
    image: postgres:15
    container_name: socket-io-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: socket_user
      POSTGRES_DB: socket_db
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - ./hedgedoc-db-data:/var/lib/postgresql/data # Persistent storage for PostgreSQL data
    restart: always
    networks:
      - app-network
    dns:
      - 172.28.0.2

  socket-io-server:
    build:
      context: ../../
      dockerfile: devops/socket.io/Dockerfile
    image: socket-io-server:latest
    container_name: socket-io-server
    ports:
      - "3001:3001"
    env_file:
      # ← optional, .env is auto-loaded anyway
      - .env
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    external: true
