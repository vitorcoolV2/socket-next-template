
services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    ports:
      - "127.0.0.1:53:53/tcp"
      - "127.0.0.1:53:53/udp"
      - "8080:443/tcp"
    env_file:
      - .env
    environment:
      - PHP_ENV_CONFIG["PHP_ERROR_LOG"]="/var/log/lighttpd/error-pihole.log"
      - PHP_ENV_CONFIG[session.gc_maxlifetime]=86400
      - PHP_ENV_CONFIG[session.cookie_lifetime]=86400
      - DNS1=8.8.8.8
      - DNS2=1.1.1.1
    volumes:
      - './etc-pihole:/etc/pihole'
      - './etc-dnsmasq.d:/etc/dnsmasq.d'
    cap_add:
      - NET_ADMIN
      - CAP_SYS_TIME
      - CAP_SYS_NICE

    networks:
      app-network:
        ipv4_address: 172.28.0.2 # Static IP for Pi-hole    
    restart: always    

networks:
  app-network:
    external: true
    ipam:
      config:
        - subnet: 172.28.0.0/24
        - gateway: 172.28.0.1
