services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: chat
    restart: unless-stopped
    networks:
      - app-network
    environment:
      - 'ENABLE_OIDC_AUTH=True'
      - 'OIDC_PROVIDER_NAME=Authentik'
      - 'OIDC_ISSUER_URL=https://auth.home2500.local/application/o/chat/'
      - 'OIDC_CLIENT_ID=${OIDC_ID}'
      - 'OIDC_CLIENT_SECRET=${OIDC_SECRET}'
      - 'OIDC_REDIRECT_URI=https://chat.home2500.local/oidc/callback'
      - 'OIDC_SCOPE=openid email profile'
      # Isto permite que novos utilizadores do Authentik criem conta automaticamente
      - 'ENABLE_SIGNUP=True'
      #####
      - RAG_EMBEDDING_ENGINE=ollama
      - CORS_ALLOW_ORIGIN=https://chat.home2500.local
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - OLLAMA_BASE_URL=http://ai.app-network:11434 # Aponta para o seu container 'ai'
    volumes:
      - open-webui:/app/backend/data
    deploy:
      resources:
        limits:
          memory: 1G # Limite para não sufocar o sistema
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.chat.rule=Host(`chat.home2500.local`)'
      - 'traefik.http.routers.chat.entrypoints=websecure'
      - 'traefik.http.routers.chat.tls=true'
      #- 'traefik.http.routers.chat.middlewares=authentik-sso@file,security-headers@file'
      - 'traefik.http.services.chat.loadbalancer.server.port=8080'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:8080/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: ai
    environment:
      - OLLAMA_KEEP_ALIVE=24h # Keep model in RAM for speed
      - OLLAMA_NUM_PARALLELS=2 # Optimize for GPU
    # Pre-pull lightweight models for OpenCode workflow
    # - qwen2.5-coder: coding
    # - phi3: reasoning/chain-of-thought (excellent for explaining code)
    entrypoint: >
      /bin/sh -c "ollama serve & sleep 3 && ollama pull qwen2.5-coder:1.5b && ollama pull qwen2.5-coder:14b-instruct && wait"
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]

volumes:
  ollama_data:
  open-webui:

networks:
  app-network:
    external: true
