# traefik.yml - Equivalent to nginx.conf
api:
  dashboard: true
  debug: false
  insecure: true

entryPoints:
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ':443'

providers:
  docker:
    endpoint: 'unix:///var/run/docker.sock'
    exposedByDefault: false
    network: 'app-network'

  file:
    directory: '/etc/traefik/config'
    watch: true

# In traefik/traefik.yml
tls:
  options:
    default:
      minVersion: VersionTLS12
  stores:
    default:
      defaultCertificate:
        certFile: '/etc/traefik/certs/home2500.local/traefik.cert.pem'
        keyFile: '/etc/traefik/certs/home2500.local/traefik.key.pem'

log:
  level: DEBUG
  format: common

accessLog: {}
