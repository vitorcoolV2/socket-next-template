# In traefik/config/dynamic.yaml
tls:
  stores:
    default:
      defaultCertificate:
        certFile: '/etc/traefik/certs/home2500.local/traefik.cert.pem'
        keyFile: '/etc/traefik/certs/home2500.local/traefik.key.pem'

http:
  services:
    authelia:
      loadBalancer:
        servers:
          - url: 'http://auth.app-network:9091'
        passHostHeader: true

    uptime-kuma: # Consistent naming
      loadBalancer:
        servers:
          - url: 'http://kuma:3001' # Fixed: container name + internal port

    pihole:
      loadBalancer:
        servers:
          - url: 'http://pihole:80'

    portainer:
      loadBalancer:
        servers:
          - url: 'http://portainer:9000'

    navbar:
      loadBalancer:
        servers:
          - url: 'http://navbar-proxy:80'

  ## THE MIDDLEWARE
  middlewares:
    # Security headers
    security-headers:
      headers:
        frameDeny: true
        sslRedirect: true
        browserXssFilter: true
        contentTypeNosniff: true

    # CSP for nginx navbar (more permissive)
    csp-navbar:
      headers:
        customResponseHeaders:
          Content-Security-Policy: "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'"

    # CSP Override for navbar
    csp-portainer:
      headers:
        customResponseHeaders:
          Content-Security-Policy: "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: https:; img-src 'self' data: https:; font-src 'self' data: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.matomo.cloud; connect-src 'self' https://portainer-ce.matomo.cloud"

    # CSP for other services (more restrictive)
    csp-strict:
      headers:
        customResponseHeaders:
          Content-Security-Policy: "default-src 'self' 'unsafe-inline'"

    csp-default:
      headers:
        customResponseHeaders:
          Content-Security-Policy: "default-src 'self' 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:"

    # Authelia Forward Auth
    auth-authelia:
      forwardAuth:
        address: 'http://auth:9091/api/verify?rd=https://auth.home2500.local/'
        authResponseHeaders:
          - 'Remote-User'
          - 'Remote-Groups'
          - 'Remote-Name'
          - 'Remote-Email'
        trustForwardHeader: true

    authelia-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: 'https'
          X-Forwarded-Host: 'auth.home2500.local'
          X-Forwarded-Port: '443'
          X-Forwarded-Uri: '/'

    universal-navbar:
      headers:
        customResponseHeaders:
          Content-Security-Policy: "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'"
          X-Universal-Navbar: 'enabled'
        customRequestHeaders:
          X-Forwarded-Navbar: 'true'

    protected-portainer:
      chain:
        middlewares:
          - auth-authelia
          - security-headers
          - csp-portainer # ← Portainer-specific CSP

    # Combined middleware for protected default services is  protected-strict
    protect-default:
      chain:
        middlewares:
          - auth-authelia
          - security-headers
          - csp-default

    # Combined middleware for public services (navbar only)
    public-default:
      chain:
        middlewares:
          - security-headers
          - csp-strict

  ### THE ROUTES
  routers:
    # Traefik Dashboard
    traefik-dashboard:
      rule: 'Host(`traefik.home2500.local`)'
      entryPoints: ['websecure']
      service: 'api@internal'
      middlewares: ['protect-default']
      tls: {} # Enable TLS

    kuma:
      rule: 'Host(`kuma.home2500.local`)'
      entryPoints: ['websecure']
      service: 'uptime-kuma'
      middlewares: ['protect-default']
      tls: {}

    # Pi-hole
    pihole:
      rule: 'Host(`pihole.home2500.local`)'
      entryPoints: ['websecure']
      service: 'pihole'
      middlewares: ['protect-default']
      tls: {} # Enable TLS

    # Authelia Dashboard
    authelia:
      rule: 'Host(`auth.home2500.local`)'
      entryPoints: ['websecure']
      service: 'authelia'
      middlewares:
        - 'public-default' # ← MOVED TO SAME LEVEL
        # hung service DO NOT ENABLE - 'security-headers'
        - 'authelia-headers' # required
      tls: {}

      # Portainer with Authelia
    portainer:
      rule: 'Host(`portainer.home2500.local`)'
      entryPoints: ['websecure']
      service: 'portainer'
      middlewares: ['protect-default']
      tls: {}
